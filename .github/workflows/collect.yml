name: collect

on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = KST 18:30, 평일 (DART 당일 접수분 반영 후)
  push:                       # 수집기·워크플로를 고치면 바로 한 번 돌려 확인
    branches: [main]
    paths: ["collector/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "daily: 증분 수집 / backfill: 기간 지정 수집"
        type: choice
        options: [daily, backfill]
        default: daily
      from_date:
        description: "backfill 시작일 (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"
      max_corps:
        description: "회당 증권신고서 주요정보 조회 기업 수 상한 (비우면 무제한)"
        required: false
      max_docs:
        description: "회당 공시 원문 추출 건수 상한 (비우면 무제한)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 단위 테스트
        run: python -m unittest discover -s tests

      - name: 텍스트 덤프에서 DB 복원
        run: python -m collector.run restore

      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          FROM_DATE: ${{ github.event.inputs.from_date || '2025-01-01' }}
          MAX_CORPS: ${{ github.event.inputs.max_corps }}
          MAX_DOCS: ${{ github.event.inputs.max_docs }}
        run: |
          args=()
          if [ -n "$MAX_CORPS" ]; then args+=(--max-corps "$MAX_CORPS"); fi
          if [ -n "$MAX_DOCS" ]; then args+=(--max-docs "$MAX_DOCS"); fi
          if [ "$MODE" = "backfill" ]; then
            python -m collector.run backfill --from "$FROM_DATE" "${args[@]}"
          else
            python -m collector.run daily "${args[@]}"
          fi

      - name: KIND 상장예비심사 현황 (실패해도 계속)
        continue-on-error: true
        run: python -m collector.run kind

      - name: 변경분 커밋
        run: |
          git config user.name "ipo-db-bot"
          git config user.email "ipo-db-bot@users.noreply.github.com"
          git add data/ipo.sql docs/data/deals.json data/kind/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 수집분 반영"
            # 실행 중에 코드 커밋이 올라온 경우를 대비해 최신 main 위에 얹어서 올립니다.
            git pull --rebase -X theirs origin main || { git rebase --abort; echo "원격 변경과 충돌: 다음 실행에서 다시 수집합니다."; exit 0; }
            git push
          fi
