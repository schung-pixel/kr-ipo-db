name: collect

on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = KST 18:30, 평일 (DART 당일 접수분 반영 후)
    - cron: "10 3,15 * * *"  # KST 12:10·00:10: 과거 구간 대기열 이어 받기 (남은 구간이 없으면 일일 수집만 하고 끝남)
  push:                       # 수집기·워크플로를 고치면 바로 한 번 돌려 확인
    branches: [main]
    paths: ["collector/**", ".github/workflows/**", "data/backfill.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "daily: 증분 수집 / backfill: 기간 지정 수집"
        type: choice
        options: [daily, backfill]
        default: daily
      from_date:
        description: "backfill 시작일 (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"
      max_corps:
        description: "회당 증권신고서 주요정보 조회 기업 수 상한 (비우면 무제한)"
        required: false
      max_docs:
        description: "회당 공시 원문 추출 건수 상한 (비우면 무제한)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DART_VIEWER: "0"   # 공시 뷰어(dart.fss.or.kr)는 Actions에서 접속되지 않음: 2019년 이전 원문은 로컬에서 채워 커밋
      DART_DOC_CACHE: ".cache/dart"   # 공시 원문 보관(같은 원문을 단계마다 다시 받지 않음, 실행 간에도 최근분 유지)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 실행을 일으킨 커밋이 아니라 최신 main(최신 데이터)에서 시작해야 이전 데이터로 덮어쓰지 않습니다.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 공시 원문 보관본 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache/dart
          key: dartdoc-${{ github.run_id }}
          restore-keys: dartdoc-

      - run: mkdir -p .cache/dart && touch .cache/start_marker

      - name: 단위 테스트
        run: python -m unittest discover -s tests

      - name: 텍스트 덤프에서 DB 복원
        run: python -m collector.run restore

      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          FROM_DATE: ${{ github.event.inputs.from_date || '2025-01-01' }}
          MAX_CORPS: ${{ github.event.inputs.max_corps }}
          MAX_DOCS: ${{ github.event.inputs.max_docs }}
        run: |
          args=()
          if [ -n "$MAX_CORPS" ]; then args+=(--max-corps "$MAX_CORPS"); fi
          if [ -n "$MAX_DOCS" ]; then args+=(--max-docs "$MAX_DOCS"); fi
          if [ "$MODE" = "backfill" ]; then
            python -m collector.run backfill --from "$FROM_DATE" "${args[@]}"
          else
            python -m collector.run daily "${args[@]}"
          fi

      - name: 과거 구간 수집 (data/backfill.json, 구간마다 커밋)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          git config user.name "ipo-db-bot"
          git config user.email "ipo-db-bot@users.noreply.github.com"
          start=$(date +%s)
          # 한 구간이 최대 1시간 남짓 걸리므로 시작 후 4시간 30분까지만 새 구간을 시작합니다.
          while [ $(( $(date +%s) - start )) -lt 16200 ]; do
            set +e
            python -m collector.run queue
            rc=$?
            set -e
            if [ "$rc" = "3" ]; then echo "남은 과거 구간 없음"; break; fi
            if [ "$rc" != "0" ] && [ "$rc" != "4" ]; then echo "구간 수집 오류(rc=$rc)"; break; fi
            git add data/ipo.sql docs/data/deals.json data/backfill.json
            if ! git diff --cached --quiet; then
              git commit -q -m "data: 과거 구간 수집 진행분"
              git pull --rebase origin main || { git rebase --abort; break; }
              git push
            fi
            if [ "$rc" = "4" ]; then echo "DART 한도 도달: 다음 실행에서 재개"; break; fi
          done

      - name: KIND 상장예비심사 현황 (실패해도 계속)
        continue-on-error: true
        run: python -m collector.run kind

      - name: 공시 원문 보관본 정리(최근 2GB만)
        id: doccache
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          start = Path(".cache/start_marker").stat().st_mtime
          fs = sorted(Path(".cache/dart").rglob("*.zip"), key=lambda p: p.stat().st_mtime, reverse=True)
          new = sum(1 for p in fs if p.stat().st_mtime > start)
          total = 0
          for p in fs:
              total += p.stat().st_size
              if total > 2 * 1024 ** 3:
                  p.unlink()
          print(f"원문 보관본 {len(fs)}건(이번 실행 {new}건), {min(total, 2 * 1024 ** 3) / 1024 ** 2:,.0f}MB")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new={new}\n")
          PY

      - name: 공시 원문 보관본 저장(새로 받은 원문이 있을 때만)
        if: always() && steps.doccache.outputs.new != '0' && steps.doccache.outputs.new != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/dart
          key: dartdoc-${{ github.run_id }}

      - name: 변경분 커밋
        run: |
          git config user.name "ipo-db-bot"
          git config user.email "ipo-db-bot@users.noreply.github.com"
          git add data/ipo.sql docs/data/deals.json data/kind/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 수집분 반영"
            # 실행 중에 코드 커밋이 올라온 경우를 대비해 최신 main 위에 얹어서 올립니다.
            git pull --rebase origin main || { git rebase --abort; echo "원격 변경과 충돌: 다음 실행에서 다시 수집합니다."; exit 0; }
            git push
          fi
