<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPO 데이터룸</title>
<meta name="description" content="DART 증권신고서 기반 국내 IPO 공모 현황">
<meta name="theme-color" content="#F3F5F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("ipo-db-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div class="safeband" aria-hidden="true"></div>
<div class="wrap">
  <header class="top glass">
    <div class="brand">
      <h1>IPO 데이터룸</h1>
    </div>
    <nav class="tabs" aria-label="화면">
      <span class="ind" aria-hidden="true"></span>
      <a class="tab" href="#/" data-tab="list">딜 목록</a>
      <a class="tab" href="#/stats" data-tab="stats">통계</a>
    </nav>
    <div class="topacts">
      <div class="tgl" id="tgl" role="group" aria-label="화면 테마">
        <button type="button" data-t="light" aria-pressed="true" title="라이트 모드"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></g></svg><span class="tl">라이트</span></button>
        <button type="button" data-t="dark" aria-pressed="false" title="다크 모드"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1z" fill="currentColor"/></svg><span class="tl">다크</span></button>
      </div>
    </div>
  </header>
  <nav class="pager" aria-label="화면">
    <a href="#/" data-tab="list" aria-label="딜 목록"><i></i><span>딜 목록</span></a>
    <a href="#/stats" data-tab="stats" aria-label="통계"><i></i><span>통계</span></a>
  </nav>
  <main id="app" tabindex="-1"><p class="hint">불러오는 중…</p></main>
  <footer class="foot">
    <p>금융감독원 전자공시시스템(DART) 공시를 가공한 자료입니다. 희망 밴드, 확정가, 경쟁률, 상장일은 공시 원문에서 규칙으로 추출한 값입니다. 투자 판단의 근거로 사용하기 전에 원문 공시를 확인해 주십시오.</p>
  </footer>
</div>
<div class="shade" id="shade" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head">
    <div>
      <div class="sh-title"><h2 id="sheet-title"></h2><span id="sheet-chip"></span></div>
      <p class="sub" id="sheet-sub"></p>
    </div>
    <div class="sh-acts">
      <span class="pos-n" id="sheet-pos"></span>
      <button type="button" class="xbtn glass" id="s-prev" aria-label="이전 딜"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
      <button type="button" class="xbtn glass" id="s-next" aria-label="다음 딜"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      <button type="button" class="xbtn glass" id="s-close" aria-label="닫기"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    </div>
    <ol class="tl4" id="sheet-tl" aria-label="공모 일정" hidden></ol>
  </div>
  <div class="sbody" id="sbody"></div>
</section>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
